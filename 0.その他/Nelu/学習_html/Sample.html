<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cafe-Steria Home</title>

    <style>
      #wrapper .back-image {
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        position: fixed;
      }
      #wrapper .wallpaper {
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position-x: 50%; /*x座標(50%:中央) centerと同義*/
        background-position-y: 0%;
        opacity: 1; /*不透明度(0:完全透明　1:完全不透明)*/
      }
    </style>
    <style>
      #move-header {
        position: fixed;
        width: 100%;
        height: 150px;
        top: 0;
        left: 0;
        line-height: 150px;
        background: rgba(10,10,10,.5);
        box-sizing: border-box;
        transition: .5s;
      }
      #move-header .logo{
        font-size: 2em;
        text-align: center;
        color: #fff;
      }
      footer{
        width: 100%;
        height: 2000px;
        font-size: 2em;
        text-align: center;
        color: #fafafa;
        background: #333333;
        padding: .5em;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="cafe-steria-home">


    <div id="wrapper">
      <div class="back-image">
        <div class="wallpaper" style="background-image:url('backimage2.jpeg')">
        </div>
      </div>
    </div>

    <div id="move-header">
      <div class="logo">カフェ-すてりあ</div>
    </div>

    <footer>すてりあ</footer>

    <script>
      alert("Hello World");
      document.write("Hello World!");
    </script>
    
  </body>
</html>
